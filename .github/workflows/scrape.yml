name: Scheduled Scraping

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masco
          POSTGRES_PASSWORD: masco_scraper
          POSTGRES_DB: masco_intel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: cd packages/db && pnpm migrate
        env:
          DATABASE_URL: 'postgresql://masco:masco_scraper@localhost:5432/masco_intel'

      - name: Run scrapers
        run: cd packages/scrapers && pnpm dev
        env:
          DATABASE_URL: 'postgresql://masco:masco_scraper@localhost:5432/masco_intel'
          NODE_ENV: production
          HEADLESS: 'true'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scraper-results
          path: ./scraper-results.json
          retention-days: 30
